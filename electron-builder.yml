appId: com.tikuben.app
productName: 题库本
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  - '!node_modules/**/*'

extraResources:
  - from: resources
    to: resources

asar: true

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Tikuben-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 题库本
  # 数据在 %APPDATA%\题库本，卸载不删
  deleteAppDataOnUninstall: false
